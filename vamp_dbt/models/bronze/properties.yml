version: 2

models:
  - name: bronze_returns #  Must match the filename of a model -- including case sensitivity.
    config:
        materialized: view
        schema: bronze
    
  - name: bronze_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null


  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null

      - name: country
        data_tests:
          - accepted_values: 
              arguments:
                values: ['USA', 'Canada', 'Mexico']

              config:
                severity: warn